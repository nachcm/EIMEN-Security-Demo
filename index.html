<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EIMEN Security Demo</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090c12;color:#f7f3ed;font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.app{max-width:520px;margin:auto;min-height:100dvh;padding:20px 18px 92px;background:linear-gradient(145deg,#141923,#090c12 65%)}header{display:flex;align-items:center;gap:12px;margin-bottom:20px}header img{width:72px;height:53px;object-fit:contain;background:white;border-radius:9px}h1{font-size:22px;margin:0}small,.muted{color:#b5afaa}.gold{color:#d8b66c}.tag{display:inline-block;background:#352b18;color:#e9c67a;border-radius:20px;padding:6px 10px;font-size:12px;margin-bottom:18px}.hero{background:linear-gradient(125deg,#57121d,#1b1e27);border:1px solid #8c3945;border-radius:20px;padding:20px;margin-bottom:18px}.hero h2{margin:0 0 8px;font-size:22px}.hero p{color:#ded3d1;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:#1a1d25;border:1px solid #3a3a40;border-radius:17px;padding:22px 12px;text-align:center;color:inherit;min-height:135px;cursor:pointer}.tile .ico{font-size:30px;display:block;margin-bottom:12px}.tile b{display:block;font-size:16px}.tile small{display:block;margin-top:7px;font-size:12px}.panel{background:#1b1e26;border:1px solid #353941;border-radius:16px;padding:18px;margin-top:16px}.panel h2{font-size:19px;margin:0 0 10px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #363841}.row:last-child{border:0}.btn{background:#86192d;color:white;border:0;border-radius:12px;padding:12px 16px;font-size:15px;cursor:pointer}.btn.secondary{background:#30333b}.back{background:none;border:0;color:#d8b66c;font-size:16px;padding:0 0 18px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;display:flex;background:#151821;border-top:1px solid #333;padding:12px 6px calc(12px + env(safe-area-inset-bottom));justify-content:space-around}.nav button{background:none;border:0;color:#c8c3bd;font-size:13px}.nav button.active{color:#e6bb6b}.camera{height:150px;background:linear-gradient(145deg,#252e38,#0b1017);display:grid;place-items:center;border-radius:12px;color:#b8b8bd;margin:12px 0}.notice{font-size:13px;color:#c8bda8;margin-top:16px;line-height:1.5}</style></head><body><div class="app"><header><img src="logo.jpg" alt="Grupo Eimen"><div><h1>EIMEN <span class="gold">Security</span></h1><small>Sistemas y Servicios</small></div></header><div class="tag">● DEMOSTRACIÓN · Sin conexión a equipos</div><main id="content"></main></div><nav class="nav"><button onclick="show('inicio')">⌂<br>Inicio</button><button onclick="show('camaras')">▦<br>Cámaras</button><button onclick="show('eventos')">♧<br>Eventos</button><button onclick="show('ajustes')">⚙<br>Ajustes</button></nav><script>const pages={inicio:`<section class="hero"><h2>Bienvenido a EIMEN Security</h2><p>Tu seguridad, siempre contigo.</p></section><div class="grid">${[['📹','Cámaras','Vista en directo','camaras'],['🛡️','Alarma','Estado y control','alarma'],['🚪','Videoportero','Llamadas y apertura','videoportero'],['🎞️','Grabaciones','Buscar y reproducir','grabaciones'],['🔔','Notificaciones','Eventos y avisos','eventos'],['🎧','Soporte','Grupo Eimen','soporte']].map(x=>`<button class="tile" onclick="show('${x[3]}')"><span class="ico">${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</div><div class="panel"><b class="gold">Estado del sistema</b><p class="muted">Pendiente de conectar con Hik-Partner Pro.</p></div>`,camaras:`<h2>Cámaras</h2><div class="panel"><b>Cámara de entrada · Ejemplo</b><div class="camera">📹 Vista previa de demostración</div><button class="btn" onclick="alert('El vídeo en directo estará disponible cuando se integre el SDK autorizado.')">Ver en directo</button></div>`,alarma:`<h2>Alarma AX PRO</h2><div class="panel"><div class="row"><span>Estado</span><b class="gold">Sin conectar</b></div><p class="muted">Los controles reales se habilitarán tras la integración y validación de permisos.</p><button class="btn" onclick="alert('Simulación únicamente. No se ha armado ninguna alarma.')">Simular armado</button></div>`,videoportero:`<h2>Videoportero</h2><div class="panel"><div class="camera">🚪 Vista de demostración</div><button class="btn" onclick="alert('Demostración: no se ha abierto ninguna puerta.')">Simular apertura</button></div>`,grabaciones:`<h2>Grabaciones</h2><div class="panel"><p>Calendario y línea de tiempo de grabaciones.</p><p class="muted">No hay grabaciones conectadas en esta demostración.</p></div>`,eventos:`<h2>Notificaciones</h2><div class="panel"><p>No hay eventos reales.</p><p class="muted">Aquí aparecerán las alertas autorizadas de tus instalaciones.</p></div>`,soporte:`<h2>Soporte Grupo Eimen</h2><div class="panel"><p>Asistencia técnica para clientes.</p><p class="muted">Podremos configurar teléfono, correo y solicitudes de servicio.</p></div>`,ajustes:`<h2>Ajustes</h2><div class="panel"><div class="row">Empresa <b>Grupo Eimen</b></div><div class="row">Versión <b>Demo 0.1</b></div><div class="row">Conexión <b class="gold">No configurada</b></div></div>`};function show(page){document.getElementById('content').innerHTML=(page==='inicio'?'':`<button class="back" onclick="show('inicio')">← Inicio</button>`)+(pages[page]||pages.inicio)+`<p class="notice">Prototipo visual. No controla dispositivos, no recibe vídeo y no almacena datos de clientes.</p>`;document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',['inicio','camaras','eventos','ajustes'][i]===page));window.scrollTo(0,0)}show('inicio');</script></body></html>
